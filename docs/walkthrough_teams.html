<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokemon Walkthrough Commander</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Alfa+Slab+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0f0e0c;
      --bg-secondary: #1a1815;
      --surface-dark: #252220;
      --surface-light: #2f2c28;
      --text-primary: #f5f3ef;
      --text-secondary: #c4bfb5;
      --accent-primary: #ff6b35;
      --accent-secondary: #f7b801;
      --accent-water: #4a90e2;
      --accent-grass: #2ecc71;
      --accent-fire: #e74c3c;
      --accent-elite: #9b59b6;
      --accent-champion: #f39c12;
      --success: #27ae60;
      --warning: #e67e22;
      --rare: #e74c3c;
      --common: #27ae60;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 20px rgba(255, 107, 53, 0.3);
    }

    [data-starter-theme="grass"] {
      --accent-primary: #27ae60;
      --accent-secondary: #2ecc71;
    }
    [data-starter-theme="fire"] {
      --accent-primary: #e74c3c;
      --accent-secondary: #f39c12;
    }
    [data-starter-theme="water"] {
      --accent-primary: #4a90e2;
      --accent-secondary: #3498db;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      font-family: "Fredoka", sans-serif;
      line-height: 1.6;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(74, 144, 226, 0.05) 0%, transparent 50%);
    }

    .shell {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, rgba(26, 24, 21, 0.95) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--accent-primary);
      padding: 16px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-family: "Alfa Slab One", cursive;
      font-size: 2.2rem;
      margin: 0;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: 1px;
    }

    .pokeball {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 40%, transparent 70%);
      border-radius: 50%;
      border: 3px solid var(--accent-primary);
      position: relative;
      animation: spin 3s linear infinite;
    }

    .pokeball::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 50%;
      background: var(--accent-primary);
      top: 0;
      border-radius: 50% 50% 0 0;
    }

    .pokeball::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border: 2px solid var(--accent-primary);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    @keyframes spin {
      0% { transform: rotateZ(0deg); }
      100% { transform: rotateZ(360deg); }
    }

    .header-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: "Fredoka", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .controls-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .control-group select,
    .control-group input {
      padding: 10px 12px;
      background: var(--surface-light);
      border: 2px solid var(--accent-primary);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .control-group select:hover,
    .control-group input:hover {
      border-color: var(--accent-secondary);
      background: var(--surface-dark);
    }

    .control-group select:focus,
    .control-group input:focus {
      outline: none;
      box-shadow: 0 0 12px rgba(255, 107, 53, 0.4);
      background: var(--surface-dark);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(39, 174, 96, 0.1);
      border-left: 4px solid var(--success);
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Main Layout */
    .main-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1200px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 120px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }

    .sidebar-panel {
      background: linear-gradient(135deg, var(--surface-dark), var(--surface-light));
      border: 2px solid var(--accent-primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-lg);
    }

    .sidebar-title {
      font-family: "Alfa Slab One", cursive;
      font-size: 1.3rem;
      margin: 0 0 12px 0;
      color: var(--accent-secondary);
      text-transform: uppercase;
    }

    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 16px 0;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .timeline::-webkit-scrollbar {
      width: 6px;
    }

    .timeline::-webkit-scrollbar-track {
      background: transparent;
    }

    .timeline::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 3px;
    }

    .timeline-item {
      padding: 12px;
      background: var(--surface-light);
      border: 2px solid var(--accent-primary);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .timeline-item:hover {
      border-color: var(--accent-secondary);
      transform: translateX(4px);
    }

    .timeline-item.active {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(247, 184, 1, 0.1));
      border-color: var(--accent-secondary);
      box-shadow: var(--shadow-glow);
    }

    .timeline-item.elite-fight {
      border-color: var(--accent-elite);
    }

    .timeline-item.champion-fight {
      border-color: var(--accent-champion);
      background: linear-gradient(135deg, rgba(243, 156, 18, 0.15), transparent);
    }

    .timeline-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: var(--accent-primary);
      color: #000;
      border-radius: 4px;
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .timeline-badge.elite {
      background: var(--accent-elite);
    }

    .timeline-badge.champion {
      background: var(--accent-champion);
    }

    /* Content Area */
    .content-area {
      display: grid;
      gap: 20px;
    }

    .panel {
      background: linear-gradient(135deg, var(--surface-dark), var(--surface-light));
      border: 2px solid var(--accent-primary);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel-header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--accent-primary);
    }

    .panel-title {
      font-family: "Alfa Slab One", cursive;
      font-size: 1.8rem;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      color: var(--accent-secondary);
    }

    .panel-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Boss Overview */
    .boss-overview {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .boss-overview {
        grid-template-columns: 1fr;
      }
    }

    .boss-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .boss-name {
      font-family: "Alfa Slab One", cursive;
      font-size: 2.4rem;
      margin: 0;
      color: var(--accent-primary);
      text-transform: uppercase;
    }

    .boss-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid var(--accent-primary);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.elite {
      background: rgba(155, 89, 182, 0.2);
      border-color: var(--accent-elite);
    }

    .badge.champion {
      background: rgba(243, 156, 18, 0.2);
      border-color: var(--accent-champion);
    }

    .badge.water {
      background: rgba(74, 144, 226, 0.2);
      border-color: var(--accent-water);
    }

    .badge.grass {
      background: rgba(46, 204, 113, 0.2);
      border-color: var(--accent-grass);
    }

    .badge.fire {
      background: rgba(231, 76, 60, 0.2);
      border-color: var(--accent-fire);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 107, 53, 0.1);
      border: 2px solid var(--accent-primary);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-secondary);
    }

    /* Pokemon Cards */
    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .pokemon-card {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(247, 184, 1, 0.05));
      border: 2px solid var(--accent-primary);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .pokemon-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-secondary);
      box-shadow: var(--shadow-glow);
    }

    .pokemon-sprite {
      width: 80px;
      height: 80px;
      object-fit: contain;
      image-rendering: pixelated;
      margin: 0 auto;
    }

    .pokemon-name {
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .pokemon-level {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .pokemon-meta {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .pokemon-chips {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .pokemon-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 999px;
      border: 1px solid var(--accent-primary);
      background: rgba(255, 107, 53, 0.12);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    /* Team Matrix */
    .team-matrix {
      display: grid;
      gap: 16px;
    }

    .team-card {
      background: linear-gradient(135deg, var(--surface-dark), rgba(255, 107, 53, 0.05));
      border: 2px solid var(--accent-primary);
      border-radius: 10px;
      padding: 16px;
      transition: all 0.3s ease;
    }

    .team-card:hover {
      border-color: var(--accent-secondary);
      box-shadow: var(--shadow-glow);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--accent-primary);
    }

    .team-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 50%;
      font-weight: 800;
      font-size: 18px;
      color: #000;
    }

    .team-title {
      font-family: "Alfa Slab One", cursive;
      font-size: 1.2rem;
      margin: 0;
      text-transform: uppercase;
    }

    .team-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .team-stat {
      font-size: 11px;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid var(--accent-primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Catch Radar */
    .catch-card {
      background: linear-gradient(135deg, var(--surface-dark), rgba(46, 204, 113, 0.05));
      border: 2px solid var(--accent-grass);
      border-radius: 10px;
      padding: 14px;
      transition: all 0.3s ease;
    }

    .catch-card:hover {
      border-color: var(--accent-secondary);
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
    }

    .catch-header {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .catch-sprite {
      width: 64px;
      height: 64px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .catch-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .catch-name {
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
    }

    .catch-rarity {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .catch-rarity.common {
      background: rgba(39, 174, 96, 0.3);
      color: var(--common);
    }

    .catch-rarity.uncommon {
      background: rgba(74, 144, 226, 0.3);
      color: var(--accent-water);
    }

    .catch-rarity.rare {
      background: rgba(230, 126, 34, 0.3);
      color: var(--warning);
    }

    .catch-rarity.very-rare {
      background: rgba(231, 76, 60, 0.3);
      color: var(--rare);
    }

    .catch-details {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 107, 53, 0.2);
    }

    /* Encounter Data */
    .encounter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .encounter-card {
      background: var(--surface-light);
      border: 2px solid var(--accent-secondary);
      border-radius: 10px;
      padding: 12px;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 3px solid var(--accent-primary);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .modal-close {
      float: right;
      background: var(--accent-primary);
      color: #000;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      transform: rotate(90deg);
      box-shadow: var(--shadow-glow);
    }

    /* Loading State */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      color: var(--text-secondary);
    }

    .loading::after {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* Utilities */
    .divider {
      height: 1px;
      background: var(--accent-primary);
      opacity: 0.3;
      margin: 16px 0;
      border: none;
    }

    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }

    /* Accessibility */
    [aria-busy="true"] {
      opacity: 0.85;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-secondary);
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="header-branding">
          <div class="pokeball"></div>
          <h1 class="header-title">Walkthrough Commander</h1>
        </div>
        <div class="header-controls">
          <button id="themeBtn" class="btn">Theme</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="control-group">
          <label class="control-label">Game Version</label>
          <select id="versionSelect"></select>
        </div>
        <div class="control-group">
          <label class="control-label">Starter Filter</label>
          <select id="starterSelect"></select>
        </div>
        <div class="control-group">
          <label class="control-label">Boss Jump</label>
          <select id="bossSelect"></select>
        </div>
        <div class="control-group">
          <label class="control-label">Search Catchables</label>
          <input id="searchInput" type="text" placeholder="Name or location..." />
        </div>
      </div>

      <div class="status-bar">
        <div class="status-dot"></div>
        <span id="statusText">Initializing...</span>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-panel">
          <h2 class="sidebar-title">Journey</h2>
          <p class="sidebar-subtitle">Navigate through your adventure</p>
          <div id="timeline" class="timeline"></div>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="content-area" id="content" aria-live="polite">
        <div class="panel">
          <div class="loading">Loading walkthrough data...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="modalClose" class="modal-close">×</button>
      <h2 id="modalTitle" style="margin-top: 0;"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const DATA_PATH = "../data/gold/walkthrough_best_teams.json";
    let renderToken = 0;
    let monRegistry = new Map();
    let moveInsightCache = new Map();
    let captureRateCache = new Map();
    let captureRatePending = new Set();

    // Utility functions (keeping original implementations)
    function normName(v) { return String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
    function speciesSlug(v) { return String(v || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
    function safeText(v, fallback = "-") { return v === null || v === undefined || v === "" ? fallback : String(v); }
    function pct(v) { return Number.isFinite(Number(v)) ? `${(Number(v) * 100).toFixed(1)}%` : "-"; }
    function num(v) { return Number.isFinite(Number(v)) ? Number(v) : null; }
    function cap(v) { return String(v || "").split(/[_-]+/).filter(Boolean).map((part) => part[0].toUpperCase() + part.slice(1)).join(" "); }
    function prettyLocation(v) { return cap(String(v || "").replace(/^pokemon-/, "")); }

    function monCacheKey(mon) {
      const moves = Array.isArray(mon && mon.moves) ? mon.moves.map((m) => String(m || "").toLowerCase()).sort().join("|") : "";
      return [normName(pokemonName(mon)), num(mon && mon.level) ?? "-", moves].join("::");
    }

    function moveInsights(mon) {
      const key = monCacheKey(mon);
      if (moveInsightCache.has(key)) return moveInsightCache.get(key);

      const moves = Array.isArray(mon && mon.moves) ? mon.moves : [];
      const moveRef = window.walkthroughMoveReference || {};
      let damagingMoves = 0;
      let statusMoves = 0;
      let physicalMoves = 0;
      let specialMoves = 0;
      let strongestMove = null;
      const types = new Set();

      moves.forEach((moveName) => {
        const ref = moveRef[String(moveName || "").toLowerCase()] || {};
        if (ref.type) types.add(String(ref.type).toLowerCase());

        if (ref.is_status_move) statusMoves += 1;
        if (ref.is_damage_move) damagingMoves += 1;

        const cls = String(ref.damage_class || "").toLowerCase();
        if (cls === "physical") physicalMoves += 1;
        if (cls === "special") specialMoves += 1;

        const effectivePower = num(ref.effective_power);
        if (effectivePower !== null && (!strongestMove || effectivePower > strongestMove.effectivePower)) {
          strongestMove = { name: moveName, effectivePower, type: ref.type || null };
        }
      });

      const insight = {
        totalMoves: moves.length,
        damagingMoves,
        statusMoves,
        physicalMoves,
        specialMoves,
        coverageTypes: Array.from(types).sort(),
        strongestMove,
      };
      moveInsightCache.set(key, insight);
      return insight;
    }

    const STARTER_TYPE_BY_SPECIES = {
      bulbasaur: "grass", chikorita: "grass", treecko: "grass", turtwig: "grass", snivy: "grass", chespin: "grass",
      charmander: "fire", cyndaquil: "fire", torchic: "fire", chimchar: "fire", tepig: "fire", fennekin: "fire",
      squirtle: "water", totodile: "water", mudkip: "water", piplup: "water", oshawott: "water", froakie: "water"
    };

    const CANONICAL_STARTER_TYPES = new Set(["grass", "fire", "water"]);

    function starterType(starter) {
      return STARTER_TYPE_BY_SPECIES[String(starter || "").trim().toLowerCase()] || null;
    }

    function prettyRole(v) {
      const role = String(v || "").toLowerCase();
      if (role === "elite_four") return "Elite Four";
      if (role === "champion") return "Champion";
      if (role === "gym") return "Gym";
      return cap(role) || "Boss";
    }

    function prettyBattleType(v) {
      const t = String(v || "").toLowerCase();
      return t ? `${cap(t)} battle` : "Unknown";
    }

    function placeholderSprite() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="8" fill="#ff6b35" opacity="0.1"/><text x="32" y="37" text-anchor="middle" font-size="10" fill="#ff6b35" font-weight="bold">?</text></svg>';
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function spriteFor(mon) {
      return (mon && mon.sprite_url) || placeholderSprite();
    }

    function getQueryState() {
      const p = new URLSearchParams(window.location.search);
      return { version: p.get("version") || "", starter: p.get("starter") || "", boss: p.get("boss") || "", q: p.get("q") || "" };
    }

    function setQueryState(state) {
      const p = new URLSearchParams();
      if (state.version) p.set("version", state.version);
      if (state.starter) p.set("starter", state.starter);
      if (state.boss) p.set("boss", state.boss);
      if (state.q) p.set("q", state.q);
      history.replaceState({}, "", `${window.location.pathname}?${p.toString()}`);
    }

    function setStatus(text) {
      const el = document.getElementById("statusText");
      if (el) el.textContent = text;
    }

    function applyStarterTheme(starter) {
      const type = starterType(starter);
      if (type) document.documentElement.setAttribute("data-starter-theme", type);
      else document.documentElement.removeAttribute("data-starter-theme");
    }

    function uniqueBosses(rows) {
      const seen = new Set();
      const out = [];
      (rows || []).forEach((row) => {
        const key = row.boss_key || `${row.boss_order}:${normName(row.boss_name)}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ ...row, boss_key: key });
      });
      return out;
    }

    function starterChoices(version, payload) {
      return ((payload.starter_choices_by_version || {})[version] || []).slice();
    }

    function starterFamilyMembers(version, starter, payload) {
      const byVersion = payload.starter_family_members_by_version || {};
      return ((byVersion[version] || {})[starter] || [starter]).slice();
    }

    function allStarterSpecies(payload) {
      const species = new Set();
      const byVersion = payload.starter_family_members_by_version || {};
      Object.values(byVersion).forEach((starterMap) => {
        Object.values(starterMap || {}).forEach((family) => {
          (family || []).forEach((member) => species.add(normName(member)));
        });
      });
      return species;
    }

    function pokemonName(mon) {
      return safeText(mon && mon.name, "unknown");
    }

    function locationsForPokemon(pokemon, row) {
      const keySlug = speciesSlug((pokemon && pokemon.species_slug) || pokemonName(pokemon));
      const keyNorm = normName((pokemon && pokemon.species_slug) || pokemonName(pokemon));
      const byPokemon = row && row.catchable_locations_by_pokemon ? row.catchable_locations_by_pokemon : {};
      for (const [speciesKey, locations] of Object.entries(byPokemon || {})) {
        if (speciesSlug(speciesKey) === keySlug || normName(speciesKey) === keyNorm) {
          return Array.isArray(locations) ? locations.map(String) : [];
        }
      }
      return [];
    }

    function encounterStatsForPokemon(pokemon, row) {
      const byLoc = row && row.reachable_location_encounters ? row.reachable_location_encounters : {};
      const keySlug = speciesSlug((pokemon && pokemon.species_slug) || pokemonName(pokemon));
      let chanceMax = null;
      let captureRate = null;
      let levelMin = null;
      let levelMax = null;
      const methods = new Set();
      Object.values(byLoc || {}).forEach((entries) => {
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          if (speciesSlug(entry && entry.species) !== keySlug) return;
          const chance = num(entry && entry.encounter_chance_max);
          const rate = num(entry && entry.capture_rate);
          const minLevel = num(entry && entry.level_min);
          const maxLevel = num(entry && entry.level_max);
          if (chance !== null) chanceMax = chanceMax === null ? chance : Math.max(chanceMax, chance);
          if (rate !== null && captureRate === null) captureRate = rate;
          if (minLevel !== null) levelMin = levelMin === null ? minLevel : Math.min(levelMin, minLevel);
          if (maxLevel !== null) levelMax = levelMax === null ? maxLevel : Math.max(levelMax, maxLevel);
          const entryMethods = Array.isArray(entry && entry.encounter_methods) ? entry.encounter_methods : [];
          entryMethods.forEach((method) => {
            const normalized = String(method || "").trim().toLowerCase();
            if (normalized) methods.add(normalized);
          });
        });
      });
      return { chanceMax, captureRate, levelMin, levelMax, methods: Array.from(methods).sort() };
    }

    async function fetchCaptureRateByPokeId(pokeid) {
      const id = num(pokeid);
      if (id === null) return null;
      if (captureRateCache.has(id)) return captureRateCache.get(id);
      if (captureRatePending.has(id)) return null;

      captureRatePending.add(id);
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const rate = num(payload && payload.capture_rate);
        captureRateCache.set(id, rate);
        return rate;
      } catch (err) {
        captureRateCache.set(id, null);
        return null;
      } finally {
        captureRatePending.delete(id);
      }
    }

    async function warmCaptureRates(recommendations, data) {
      const ids = Array.from(new Set(
        (recommendations || [])
          .map((entry) => num(entry && entry.pokeid))
          .filter((id) => id !== null)
      ));
      const missingIds = ids.filter((id) => !captureRateCache.has(id));
      if (!missingIds.length) return;

      const beforeFilled = Array.from(captureRateCache.values()).filter((v) => v !== null).length;
      await Promise.all(missingIds.map((id) => fetchCaptureRateByPokeId(id)));
      const afterFilled = Array.from(captureRateCache.values()).filter((v) => v !== null).length;
      if (afterFilled > beforeFilled) {
        // Trigger one refresh once new capture-rate values are available.
        void render(data);
      }
    }

    function rarityLabel(chanceMax, locationCount) {
      const chance = num(chanceMax);
      if (chance !== null) {
        if (chance >= 35) return "common";
        if (chance >= 20) return "uncommon";
        if (chance >= 10) return "rare";
        return "very-rare";
      }
      const n = num(locationCount) || 0;
      if (n >= 4) return "common";
      if (n >= 2) return "uncommon";
      if (n >= 1) return "rare";
      return "uncommon";
    }

    function teamContainsStarter(team, version, starter, payload) {
      if (!starter) return true;
      const family = new Set(starterFamilyMembers(version, starter, payload).map(normName));
      return (Array.isArray(team && team.pokemon) ? team.pokemon : []).some((mon) => family.has(normName(pokemonName(mon))));
    }

    function topTeamsForBoss(row, version, starter, payload) {
      const byStarter = row && row.top_teams_by_starter ? row.top_teams_by_starter : {};
      if (starter && Array.isArray(byStarter[starter])) {
        const filteredStarter = byStarter[starter].filter((team) => teamContainsStarter(team, version, starter, payload));
        if (filteredStarter.length) return filteredStarter.slice(0, 5);
      }
      const raw = Array.isArray(row && row.top_teams) ? row.top_teams : [];
      const filtered = raw.filter((team) => teamContainsStarter(team, version, starter, payload));
      if (starter) return filtered.slice(0, 5);
      if (filtered.length) return filtered.slice(0, 5);
      return raw.slice(0, 5);
    }

    function buildCatchRecommendations(teams, row, version, starter, payload) {
      const starterSet = starter ? new Set(starterFamilyMembers(version, starter, payload).map(normName)) : new Set();
      const globallyBlockedStarters = allStarterSpecies(payload);
      const grouped = new Map();
      (teams || []).forEach((team, idx) => {
        const rank = num(team && team.rank_in_boss_version) || idx + 1;
        const weight = Math.max(1, 6 - rank);
        (Array.isArray(team && team.pokemon) ? team.pokemon : []).forEach((mon) => {
          const name = pokemonName(mon);
          if (starterSet.has(normName(name))) return;
          if (globallyBlockedStarters.has(normName(name))) return;
          const key = mon && mon.species_slug ? `slug:${mon.species_slug}` : `name:${normName(name)}`;
          if (!grouped.has(key)) {
            grouped.set(key, {
              name,
              score: 0,
              count: 0,
              pokeid: mon && mon.pokeid ? Number(mon.pokeid) : null,
              sprite_url: mon && mon.sprite_url ? String(mon.sprite_url) : null,
              locations: locationsForPokemon(mon, row),
              encounter: encounterStatsForPokemon(mon, row)
            });
          }
          const item = grouped.get(key);
          item.score += weight;
          item.count += 1;
        });
      });
      return Array.from(grouped.values()).sort((a, b) => (b.score - a.score) || (b.count - a.count) || a.name.localeCompare(b.name)).slice(0, 12);
    }

    function filterRowsForStarter(rows, starter) {
      if (!starter) return rows.slice();
      const chosenType = starterType(starter);
      if (!chosenType) return rows.slice();
      const filtered = rows.filter((row) => {
        const meta = row.boss_metadata || {};
        const dependencyType = String(meta.starter_dependency_type || "").toLowerCase();
        const branchCondition = String(meta.branch_condition || "").toLowerCase();
        const neededType = String(meta.starter_type || meta.starter_condition || "").toLowerCase();
        const hasExplicitStarterGate = (
          dependencyType === "branching"
          || dependencyType === "team_variant"
          || branchCondition === "starter_type"
        );
        if (!hasExplicitStarterGate) return true;
        if (!CANONICAL_STARTER_TYPES.has(neededType)) return true;
        return chosenType === neededType;
      });
      return filtered.length ? filtered : rows.slice();
    }

    function timelineHtml(rows, selectedBossKey) {
      if (!rows.length) return "<div class='empty'>No progression data</div>";
      return rows.map((row) => {
        const meta = row.boss_metadata || {};
        const role = String(meta.boss_role || "gym");
        const isFinal = row._syntheticLeague || role === "champion";
        const isElite = role === "elite_four";
        return `
          <button class="timeline-item ${row.boss_key === selectedBossKey ? "active" : ""} ${isElite ? "elite-fight" : ""} ${isFinal ? "champion-fight" : ""}"
                  data-boss="${row.boss_key}" title="${safeText(row.boss_name)}">
            <div>#${safeText(row.boss_order)} ${safeText(row.boss_name)}</div>
            ${isElite ? '<span class="timeline-badge elite">Elite</span>' : ''}
            ${isFinal && !isElite ? '<span class="timeline-badge champion">Champion</span>' : ''}
          </button>
        `;
      }).join("");
    }

    function bossSelectHtml(rows) {
      return rows.map((row) => {
        const role = row._syntheticLeague ? "Gauntlet" : prettyRole(row.boss_metadata && row.boss_metadata.boss_role);
        return `<option value="${row.boss_key}">#${safeText(row.boss_order)} ${safeText(row.boss_name)} · ${role}</option>`;
      }).join("");
    }

    function starterSelectHtml(version, payload) {
      const starters = starterChoices(version, payload);
      const options = [`<option value="">Any Starter</option>`];
      starters.forEach((starter) => { options.push(`<option value="${starter}">${cap(starter)}</option>`); });
      return options.join("");
    }

    function encounterSprite(speciesName) {
      const slug = String(speciesName || "").trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-");
      if (!slug) return placeholderSprite();
      return `https://img.pokemondb.net/sprites/black-white/normal/${slug}.png`;
    }

    function leagueTeamsForSelection(version, starter, payload) {
      const sequence = (payload.elite_four_champion_sequence_by_version || {})[version] || {};
      if (starter && sequence.by_starter && Array.isArray(sequence.by_starter[starter]) && sequence.by_starter[starter].length) {
        return sequence.by_starter[starter].slice(0, 5);
      }
      return Array.isArray(sequence.top_teams_overall) ? sequence.top_teams_overall.slice(0, 5) : [];
    }

    function sequencePct(team) {
      if (!team || typeof team !== "object") return null;
      const completion = Number.isFinite(team.sequence_completion_prob) ? Number(team.sequence_completion_prob) : null;
      const expectedPct = Number.isFinite(team.sequence_expected_wins_pct) ? Number(team.sequence_expected_wins_pct) : null;
      const legacySequence = Number.isFinite(team.sequence_win_rate) ? Number(team.sequence_win_rate) : null;
      const legacyBoss = Number.isFinite(team.mc_win_rate) ? Number(team.mc_win_rate) : null;
      if (completion !== null && completion > 0) return completion;
      if (expectedPct !== null && expectedPct > 0) return expectedPct;
      if (legacySequence !== null && legacySequence > 0) return legacySequence;
      if (legacyBoss !== null) return legacyBoss;
      if (completion !== null) return completion;
      if (expectedPct !== null) return expectedPct;
      if (legacySequence !== null) return legacySequence;
      return null;
    }

    function leagueBosses(rows) {
      return rows.filter((row) => {
        const role = String((row.boss_metadata || {}).boss_role || "");
        return role === "elite_four" || role === "champion";
      });
    }

    function buildDisplayRows(rows, gauntletTeamCount) {
      const nonLeague = rows.filter((row) => !["elite_four", "champion"].includes(String((row.boss_metadata || {}).boss_role || "")));
      const leagueRows = leagueBosses(rows);
      if (!leagueRows.length) return nonLeague;
      const champion = leagueRows.find((row) => String((row.boss_metadata || {}).boss_role || "") === "champion") || leagueRows[leagueRows.length - 1];
      const gauntletLocations = Array.from(new Set(
        leagueRows.flatMap((row) => {
          const direct = Array.isArray(row.reachable_locations) ? row.reachable_locations : [];
          if (direct.length) return direct;
          const mapKeys = row && row.reachable_location_pokemon && typeof row.reachable_location_pokemon === "object"
            ? Object.keys(row.reachable_location_pokemon)
            : [];
          return mapKeys;
        }).map((v) => String(v || "").trim().toLowerCase()).filter(Boolean)
      ));
      const synthetic = {
        ...champion,
        boss_key: `league-gauntlet:${champion.boss_key}`,
        boss_name: "Pokemon League",
        heading: "Elite Four + Champion",
        location_count: gauntletLocations.length,
        reachable_locations: gauntletLocations,
        reachable_pokemon_count: leagueRows.reduce((acc, row) => acc + (Number(row.reachable_pokemon_count) || 0), 0),
        boss_metadata: {
          ...(champion.boss_metadata || {}),
          special_tags: ["Elite Four Gauntlet", "Champion Finish"],
        },
        _syntheticLeague: true,
        _leagueRows: leagueRows,
        _hasNoTeams: gauntletTeamCount === 0,
      };
      return [...nonLeague, synthetic];
    }

    function resolveBossTeam(row, starter) {
      const variants = Array.isArray(row && row.boss_team_variants) ? row.boss_team_variants : [];
      if (!variants.length) return row && row.boss_team ? row.boss_team : null;
      if (!starter) return variants[0];
      const chosenType = starterType(starter);
      return variants.find((variant) => String(variant && variant.starter_type || "").toLowerCase() === chosenType) || variants[0];
    }

    function registerMon(mon) {
      const key = `mon:${monRegistry.size + 1}`;
      monRegistry.set(key, mon);
      return key;
    }

    function memberButton(mon) {
      const monId = registerMon(mon);
      const insights = moveInsights(mon);
      const dex = num(mon && mon.pokeid);
      return `
        <button class="pokemon-card" type="button" data-mon-id="${monId}" title="${safeText(pokemonName(mon))}">
          <img class="pokemon-sprite" src="${spriteFor(mon)}" alt="${safeText(pokemonName(mon))}" onerror="this.src='${placeholderSprite()}'" />
          <div class="pokemon-name">${safeText(cap(pokemonName(mon)))}</div>
          <div class="pokemon-level">${num(mon && mon.level) !== null ? `Lv ${num(mon.level)}` : "—"}</div>
          <div class="pokemon-meta">${dex !== null ? `Dex #${dex}` : "Dex ?"} · ${insights.totalMoves} Moves</div>
          <div class="pokemon-chips">
            <span class="pokemon-chip">Dmg ${insights.damagingMoves}</span>
            <span class="pokemon-chip">Status ${insights.statusMoves}</span>
          </div>
        </button>
      `;
    }

    function openModal(title, bodyHtml) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const modal = document.getElementById("detailModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const modal = document.getElementById("detailModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function openMonModal(monId) {
      const mon = monRegistry.get(monId);
      if (!mon) return;
      const moves = Array.isArray(mon.moves) ? mon.moves : [];
      const insights = moveInsights(mon);
      const evoIndex = window.walkthroughEvolutionIndex || {};
      const evoKey = String(pokemonName(mon) || "").trim().toLowerCase();
      const evo = evoIndex[evoKey] || {};
      const evolvesFrom = evo.evolves_from ? cap(evo.evolves_from) : null;
      const evolvesTo = Array.isArray(evo.evolves_to) ? evo.evolves_to : [];

      // Build evolution chain
      const chainStages = [];
      if (evolvesFrom) {
        chainStages.push({ name: evolvesFrom, isCurrent: false, minLevel: null });
      }
      chainStages.push({ name: pokemonName(mon), isCurrent: true, minLevel: null });
      evolvesTo.forEach(e => {
        chainStages.push({ name: e.species, isCurrent: false, minLevel: e.min_level });
      });

      const evoChainHtml = chainStages.map((stage, idx) => `
        ${idx > 0 ? '<div style="flex: 0 0 auto; color: var(--accent-secondary); font-weight: 700; font-size: 1.2rem; margin: 0 8px;">→</div>' : ''}
        <div style="flex: 0 0 auto; text-align: center; padding: 10px; background: ${stage.isCurrent ? 'rgba(255, 107, 53, 0.25)' : 'rgba(255, 107, 53, 0.08)'}; border: ${stage.isCurrent ? '3px' : '1px'} solid var(--accent-primary); border-radius: 10px; min-width: 110px;">
          <img src="${encounterSprite(stage.name)}" alt="${cap(stage.name)}" style="width: 70px; height: 70px; object-fit: contain; image-rendering: pixelated; margin-bottom: 6px;" onerror="this.src='${placeholderSprite()}'" />
          <div style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 0.5px; font-weight: 700;">${stage.isCurrent ? '★ Current' : (stage.minLevel ? `Lv ${stage.minLevel}+` : 'Base')}</div>
          <div style="font-weight: 700; font-size: 12px;">${cap(stage.name)}</div>
        </div>
      `).join("");

      const moveDetails = moves.map(moveName => {
        const moveRef = (window.walkthroughMoveReference || {})[String(moveName || "").toLowerCase()] || {};
        return `
          <div style="margin: 8px 0; padding: 8px; background: rgba(255, 107, 53, 0.1); border-radius: 6px; text-align: left;">
            <strong>${cap(moveName)}</strong>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
              ${moveRef.type ? `<div>Type: ${cap(moveRef.type)}</div>` : ""}
              ${moveRef.power ? `<div>Power: ${moveRef.power}</div>` : ""}
              ${moveRef.accuracy ? `<div>Accuracy: ${moveRef.accuracy}</div>` : ""}
              ${moveRef.pp ? `<div>PP: ${moveRef.pp}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");

      const strongestMoveHtml = insights.strongestMove
        ? `<div><strong>Best hit:</strong> ${cap(insights.strongestMove.name)}${insights.strongestMove.type ? ` (${cap(insights.strongestMove.type)})` : ""} · EP ${safeText(insights.strongestMove.effectivePower)}</div>`
        : "";

      const coverageHtml = insights.coverageTypes.length
        ? insights.coverageTypes.map((type) => `<span class="badge" style="padding: 4px 10px; font-size: 10px;">${cap(type)}</span>`).join(" ")
        : "<span style='color: var(--text-secondary);'>No typed move data</span>";

      openModal(cap(pokemonName(mon)), `
        <div style="text-align: center;">
          <img class="pokemon-sprite" src="${spriteFor(mon)}" alt="${safeText(pokemonName(mon))}" style="width: 140px; height: 140px;" onerror="this.src='${placeholderSprite()}'" />
          <h3 style="margin: 12px 0 6px 0;">${safeText(cap(pokemonName(mon)))}</h3>
          <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 16px;">Lv ${safeText(mon.level, "?")}</div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; text-align: left;">
            <div class="stat-card" style="padding: 8px;"><div class="stat-label">Dex</div><div style="font-weight: 700;">#${safeText(mon.pokeid, "?")}</div></div>
            <div class="stat-card" style="padding: 8px;"><div class="stat-label">Moves</div><div style="font-weight: 700;">${insights.totalMoves}</div></div>
            <div class="stat-card" style="padding: 8px;"><div class="stat-label">Damage Split</div><div style="font-weight: 700;">${insights.physicalMoves}P / ${insights.specialMoves}S / ${insights.statusMoves}T</div></div>
          </div>
          <div style="text-align: left; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px;">
            ${strongestMoveHtml}
          </div>

          <hr class="divider" />

          <h4 style="text-align: left; margin: 12px 0 10px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Move Coverage</h4>
          <div style="text-align: left; margin-bottom: 14px;">${coverageHtml}</div>

          <hr class="divider" />

          <h4 style="text-align: left; margin: 12px 0 10px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Evolution Line</h4>
          <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; overflow-x: auto; padding: 8px 0;">
            ${evoChainHtml}
          </div>

          <hr class="divider" />

          <h4 style="text-align: left; margin: 12px 0 8px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Moveset (${moves.length})</h4>
          ${moves.length ? `<div style="text-align: left; max-height: 300px; overflow-y: auto;">${moveDetails}</div>` : "<div style='color: var(--text-secondary);'>No moves available</div>"}
        </div>
      `);
    }

    async function render(data) {
      const token = ++renderToken;
      const container = document.getElementById("content");
      container.setAttribute("aria-busy", "true");
      setStatus("Rendering...");
      monRegistry = new Map();
      moveInsightCache = new Map();
      window.walkthroughMoveReference = data.move_reference || {};
      window.walkthroughEvolutionIndex = data.evolution_index || {};

      const version = document.getElementById("versionSelect").value;
      const starter = document.getElementById("starterSelect").value;
      applyStarterTheme(starter);
      const query = normName(document.getElementById("searchInput").value);
      const rows = filterRowsForStarter(uniqueBosses((data.walkthroughs && data.walkthroughs[version]) || []), starter).map((row) => {
        const starterTeams = starter ? ((row.top_teams_by_starter || {})[starter] || []) : [];
        const genericTeams = Array.isArray(row.top_teams) ? row.top_teams : [];
        const hasNoTeams = starter ? starterTeams.length === 0 : genericTeams.length === 0;
        return { ...row, _hasNoTeams: hasNoTeams };
      });
      const gauntletTeams = leagueTeamsForSelection(version, starter, data);
      const displayRows = buildDisplayRows(rows, gauntletTeams.length);
      const selectedKey = document.getElementById("bossSelect").value;
      const selected = displayRows.find((row) => row.boss_key === selectedKey) || displayRows[0];

      document.getElementById("timeline").innerHTML = timelineHtml(displayRows, selected ? selected.boss_key : "");
      document.getElementById("bossSelect").innerHTML = bossSelectHtml(displayRows);
      if (selected) document.getElementById("bossSelect").value = selected.boss_key;
      setQueryState({ version, starter, boss: selected ? selected.boss_key : "", q: document.getElementById("searchInput").value.trim() });

      if (!selected) {
        container.innerHTML = `<section class="panel"><div class="empty">No boss data found for ${safeText(version)}</div></section>`;
        container.removeAttribute("aria-busy");
        setStatus("No data");
        return;
      }

      const isLeagueStage = Boolean(selected && selected._syntheticLeague);
      const meta = selected.boss_metadata || {};
      const teams = isLeagueStage ? gauntletTeams : topTeamsForBoss(selected, version, starter, data);
      const leadTeam = teams[0] || selected.recommended_team || null;
      const recommendations = buildCatchRecommendations(teams, selected, version, starter, data).filter((item) => {
        if (!query) return true;
        return normName(item.name).includes(query) || (item.locations || []).some((loc) => normName(loc).includes(query));
      }).slice(0, 8); // Limit to 8 recommendations for faster rendering

      // For league stages, get boss team from first elite four member
      let bossTeamResolved = null;
      if (isLeagueStage) {
        const leagueRows = selected._leagueRows || leagueBosses(rows);
        if (leagueRows.length > 0) {
          bossTeamResolved = resolveBossTeam(leagueRows[0], starter);
        }
      } else {
        bossTeamResolved = resolveBossTeam(selected, starter);
      }
      const bossTeam = bossTeamResolved && Array.isArray(bossTeamResolved.pokemon) ? bossTeamResolved : null;

      const specialTags = Array.isArray(meta.special_tags) ? meta.special_tags : [];

      const overviewHtml = `
        <div class="panel">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;">
            <div>
              <h2 class="boss-name" style="margin-bottom: 8px;">${isLeagueStage ? "Pokemon League" : safeText(selected.boss_name)}</h2>
              <div class="boss-meta" style="margin-bottom: 16px;">
                <span class="badge ${meta.boss_role === "elite_four" ? "elite" : meta.boss_role === "champion" ? "champion" : ""}">${isLeagueStage ? "Gauntlet" : prettyRole(meta.boss_role)}</span>
                <span class="badge">${isLeagueStage ? "Multi-battle" : prettyBattleType(meta.battle_type)}</span>
              </div>
              ${bossTeam && !isLeagueStage ? `
                <div>
                  <h4 style="font-size: 0.75rem; text-transform: uppercase; margin: 0 0 12px 0; color: var(--accent-secondary); letter-spacing: 1px; font-weight: 700;">Enemy Squad</h4>
                  <div class="pokemon-grid" style="grid-template-columns: repeat(3, 1fr); gap: 12px;">${bossTeam.pokemon.map((mon) => memberButton(mon)).join("")}</div>
                </div>
              ` : ""}
            </div>
            <div class="stats-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="stat-card">
                <div class="stat-label">${isLeagueStage ? "Bosses" : "Order"}</div>
                <div class="stat-value">${isLeagueStage ? (selected._leagueRows || []).length : "#" + safeText(selected.boss_order)}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Avg Win</div>
                <div class="stat-value">${isLeagueStage ? pct(sequencePct(leadTeam)) : pct(leadTeam && leadTeam.mc_win_rate)}</div>
              </div>
              <div class="stat-card" style="grid-column: 1 / -1;">
                <div class="stat-label">Starter</div>
                <div class="stat-value">${safeText(starter ? cap(starter).substring(0, 3) : "Any")}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      let teamsHtml = '';

      if (isLeagueStage) {
        const leagueRows = selected._leagueRows || leagueBosses(rows);

        // Show all boss enemy teams in a compact grid
        const bossTeamsSection = leagueRows.map((bossRow) => {
          const bossTeamVar = resolveBossTeam(bossRow, starter);
          const bossTeamPokemon = bossTeamVar && Array.isArray(bossTeamVar.pokemon) ? bossTeamVar.pokemon : [];
          const isChampion = String((bossRow.boss_metadata || {}).boss_role || "").toLowerCase() === "champion";

          return `
            <div style="flex: 1; min-width: 200px;">
              <h4 style="font-size: 0.75rem; text-transform: uppercase; margin: 0 0 8px 0; color: ${isChampion ? "var(--accent-champion)" : "var(--accent-primary)"}; letter-spacing: 1px;">${bossRow.boss_name}</h4>
              ${bossTeamPokemon.length ? `<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">${bossTeamPokemon.map(mon => `<button class="pokemon-card" type="button" data-mon-id="${registerMon(mon)}" style="padding: 8px; min-height: 0;"><img class="pokemon-sprite" src="${spriteFor(mon)}" alt="${safeText(pokemonName(mon))}" style="width: 50px; height: 50px;" onerror="this.src='${placeholderSprite()}'" /></button>`).join("")}</div>` : '<div style="font-size: 11px; color: var(--text-secondary);">No team</div>'}
            </div>
          `;
        }).join("");

        // Show gauntlet teams (for whole sequence)
        const gauntletTeamCards = teams.slice(0, 3).map((team, idx) => {
          const rank = num(team && team.rank_in_sequence) || idx + 1;
          return `<div class="team-card"><div class="team-header"><div class="team-rank">${rank}</div><h4 class="team-title" style="margin: 0; flex: 1; font-size: 0.95rem;">${team.team_id || 'Team ' + rank}</h4></div><div class="team-stats"><span class="team-stat">${pct(sequencePct(team))}</span><span class="team-stat">Lv ${safeText(team.avg_level)}</span></div><hr class="divider" /><div class="pokemon-grid" style="grid-template-columns: repeat(6, 1fr); gap: 6px;">${Array.isArray(team && team.pokemon) ? team.pokemon.map((mon) => memberButton(mon)).join("") : ""}</div></div>`;
        }).join("");

        teamsHtml = `
          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Enemy Teams</h2>
              <p class="panel-subtitle">All 5 opponents in sequence</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; padding-bottom: 20px; border-bottom: 2px solid var(--accent-primary); margin-bottom: 20px;">
              ${bossTeamsSection}
            </div>

            <h3 style="font-family: 'Alfa Slab One'; font-size: 1.1rem; margin: 0 0 12px 0; text-transform: uppercase;">Best Gauntlet Teams</h3>
            <div class="team-matrix">
              ${gauntletTeamCards}
            </div>
          </div>
        `;
      } else if (teams.length) {
        // Regular boss teams
        const teamCards = teams.slice(0, 5).map((team, idx) => {
          const rank = num(team && team.rank_in_boss_version) || idx + 1;
          return `<div class="team-card"><div class="team-header"><div class="team-rank">${rank}</div><h4 class="team-title" style="margin: 0; flex: 1;">${team.team_id || 'Team ' + rank}</h4></div><div class="team-stats"><span class="team-stat">Win ${pct(team.mc_win_rate)}</span><span class="team-stat">${safeText(team.wins)}/${safeText(team.n_trials)}</span><span class="team-stat">Lv ${safeText(team.avg_level)}</span></div><hr class="divider" /><div class="pokemon-grid">${Array.isArray(team && team.pokemon) ? team.pokemon.map((mon) => memberButton(mon)).join("") : ""}</div></div>`;
        }).join("");
        teamsHtml = `<div class="panel"><div class="panel-header"><h2 class="panel-title">Recommended Teams</h2><p class="panel-subtitle">${teams.length} available</p></div><div class="team-matrix">${teamCards}</div></div>`;
      } else {
        teamsHtml = `<div class="panel"><div class="empty">No teams available</div></div>`;
      }

      const catchHtml = recommendations.length ? `<div class="panel"><div class="panel-header"><h2 class="panel-title">Catch Radar</h2><p class="panel-subtitle">Top Pokemon recommendations</p></div><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;">${recommendations.map((entry) => {const rarity = rarityLabel(entry.encounter && entry.encounter.chanceMax, (entry.locations || []).length); const levelLabel = (num(entry.encounter && entry.encounter.levelMin) !== null || num(entry.encounter && entry.encounter.levelMax) !== null) ? `${safeText(entry.encounter.levelMin, "?")} - ${safeText(entry.encounter.levelMax, "?")}` : "?"; const chanceLabel = num(entry.encounter && entry.encounter.chanceMax) !== null ? pct((entry.encounter.chanceMax || 0) / 100) : "-"; const methods = Array.isArray(entry.encounter && entry.encounter.methods) ? entry.encounter.methods : []; const methodLabel = methods.length ? methods.map((m) => cap(m)).join(", ") : "Unknown"; const topLocations = (entry.locations || []).slice(0, 2).map((loc) => prettyLocation(loc)); const fallbackCaptureRate = num(entry && entry.pokeid) !== null ? captureRateCache.get(num(entry.pokeid)) : null; const captureRateValue = num(entry.encounter && entry.encounter.captureRate) !== null ? num(entry.encounter && entry.encounter.captureRate) : (num(fallbackCaptureRate) !== null ? num(fallbackCaptureRate) : null); const captureRateLabel = captureRateValue !== null ? String(captureRateValue) : (num(entry && entry.pokeid) !== null && captureRatePending.has(num(entry.pokeid)) ? "loading..." : "n/a"); return `<div class="catch-card"><div class="catch-header"><img class="catch-sprite" src="${entry.sprite_url || placeholderSprite()}" alt="${safeText(entry.name)}" onerror="this.src='${placeholderSprite()}'" /><div class="catch-info"><div class="catch-name">${safeText(cap(entry.name))}</div><span class="catch-rarity ${rarity}">${cap(rarity)}</span></div></div><div class="catch-details"><div><strong>Priority:</strong> ${safeText(entry.score)}</div><div><strong>In ${safeText(entry.count)}/5 teams</strong></div><div><strong>Level:</strong> ${levelLabel}</div><div><strong>Best chance:</strong> ${chanceLabel}</div><div><strong>Capture rate:</strong> ${captureRateLabel}</div><div><strong>Methods:</strong> ${methodLabel}</div>${topLocations.length ? `<div><strong>Top spots:</strong> ${topLocations.join(", ")}</div>` : ""}</div></div>`;}).join("")}</div></div>` : `<div class="panel"><div class="empty">No recommendations</div></div>`;

      if (token !== renderToken) return;

      container.innerHTML = `${overviewHtml}${teamsHtml}${catchHtml}`;
      container.removeAttribute("aria-busy");
      setStatus(`Ready · ${version} · ${starter ? cap(starter) : "Any"}`);

      void warmCaptureRates(recommendations, data);

      requestAnimationFrame(() => {
        document.querySelectorAll(".timeline-item").forEach((button) => {
          button.addEventListener("click", () => {
            document.getElementById("bossSelect").value = button.dataset.boss;
            void render(data);
          });
        });
        document.querySelectorAll("[data-mon-id]").forEach((button) => {
          button.addEventListener("click", () => openMonModal(button.dataset.monId));
        });
      });
    }

    async function boot() {
      const state = getQueryState();
      let data = null;
      setStatus("Loading data...");

      try {
        const response = await fetch(DATA_PATH);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      } catch (err) {
        document.getElementById("content").innerHTML = `<section class="panel"><div class="empty">Failed to load ${DATA_PATH}</div></section>`;
        setStatus("Load failed");
        return;
      }

      const versions = Array.isArray(data && data.versions) ? data.versions : [];
      if (!versions.length) {
        document.getElementById("content").innerHTML = `<section class="panel"><div class="empty">No walkthrough data available</div></section>`;
        setStatus("Empty");
        return;
      }

      document.getElementById("versionSelect").innerHTML = versions.map((version) => `<option value="${version}">${cap(version)}</option>`).join("");
      if (state.version && versions.includes(state.version)) document.getElementById("versionSelect").value = state.version;

      const initialVersion = document.getElementById("versionSelect").value;
      document.getElementById("starterSelect").innerHTML = starterSelectHtml(initialVersion, data);
      if (state.starter) document.getElementById("starterSelect").value = state.starter;

      const initialStarter = document.getElementById("starterSelect").value;
      const initialBaseRows = filterRowsForStarter(uniqueBosses((data.walkthroughs && data.walkthroughs[initialVersion]) || []), initialStarter);
      const initialDisplayRows = buildDisplayRows(initialBaseRows, leagueTeamsForSelection(initialVersion, initialStarter, data).length);
      document.getElementById("bossSelect").innerHTML = bossSelectHtml(initialDisplayRows);
      if (state.boss) document.getElementById("bossSelect").value = state.boss;
      if (state.q) document.getElementById("searchInput").value = state.q;

      document.getElementById("versionSelect").addEventListener("change", () => {
        const version = document.getElementById("versionSelect").value;
        document.getElementById("starterSelect").innerHTML = starterSelectHtml(version, data);
        const starter = document.getElementById("starterSelect").value;
        const rows = filterRowsForStarter(uniqueBosses((data.walkthroughs && data.walkthroughs[version]) || []), starter);
        const displayRows = buildDisplayRows(rows, leagueTeamsForSelection(version, starter, data).length);
        document.getElementById("bossSelect").innerHTML = bossSelectHtml(displayRows);
        void render(data);
      });
      document.getElementById("starterSelect").addEventListener("change", () => void render(data));
      document.getElementById("bossSelect").addEventListener("change", () => void render(data));
      document.getElementById("searchInput").addEventListener("input", () => void render(data));
      document.getElementById("themeBtn").addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("walkthrough-theme", next);
        document.getElementById("themeBtn").textContent = next === "dark" ? "🌙 Dark" : "☀️ Light";
      });
      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("detailModal").addEventListener("click", (event) => {
        if (event.target && event.target.id === "detailModal") closeModal();
      });

      const savedTheme = localStorage.getItem("walkthrough-theme");
      if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
      document.getElementById("themeBtn").textContent = (savedTheme === "dark" ? "🌙 Dark" : "☀️ Light");

      await render(data);
    }

    boot().catch((err) => {
      document.getElementById("content").innerHTML = `<section class="panel"><div class="empty">Fatal error: ${safeText(err)}</div></section>`;
      setStatus("Error");
    });
  </script>
</body>
</html>
