<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkthrough Teams</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
    h1 { margin-bottom: 8px; }
    .muted { color: #6b7280; margin-bottom: 16px; }
    .hint { margin: 0 0 16px; padding: 10px 12px; background: #ecfeff; border: 1px solid #a5f3fc; border-radius: 8px; color: #155e75; font-size: 14px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .control { display: flex; flex-direction: column; gap: 6px; }
    select { padding: 8px; min-width: 220px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .title { font-weight: 700; margin-bottom: 6px; }
    .meta { color: #374151; font-size: 14px; margin-bottom: 8px; }
    .team { font-size: 14px; }
    .team-choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; }
    .team-choice { border: 1px solid #d1d5db; border-radius: 10px; padding: 8px 10px; background: #ffffff; cursor: pointer; }
    .team-choice.active { border-color: #2563eb; background: #eff6ff; }
    .team-choice-title { font-weight: 700; font-size: 13px; }
    .team-choice-meta { font-size: 12px; color: #4b5563; margin-top: 4px; }
    .pokemon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
    .pokemon-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; background: #fcfcff; display: flex; gap: 10px; align-items: flex-start; }
    .sprite { width: 72px; height: 72px; image-rendering: pixelated; object-fit: contain; background: #f8fafc; border-radius: 10px; border: 1px solid #e5e7eb; flex: 0 0 auto; }
    .pokemon-meta { min-width: 0; }
    .pokemon-name { font-weight: 700; margin-bottom: 2px; }
    .pokemon-moves { color: #4b5563; font-size: 12px; line-height: 1.35; word-break: break-word; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 12px; margin-right: 6px; }
    .section { margin-top: 12px; padding-top: 8px; border-top: 1px solid #e5e7eb; }
    .starter-box { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; margin: 14px 0; }
    .starter-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; margin-bottom: 6px; }
    .catch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
    .catch-card { border: 1px solid #dbeafe; border-radius: 12px; padding: 10px; background: #f8fbff; display: flex; gap: 10px; align-items: center; }
    .catch-meta { min-width: 0; }
    .catch-name { font-weight: 700; }
    .catch-score { color: #1d4ed8; font-size: 12px; }
    .rank-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; background: #ffffff; margin-top: 10px; }
    .sprite-strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .sprite-sm { width: 52px; height: 52px; image-rendering: pixelated; object-fit: contain; background: #f8fafc; border-radius: 8px; border: 1px solid #e5e7eb; flex: 0 0 auto; }
    .sprite-label { font-size: 11px; color: #4b5563; text-align: center; max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sprite-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .sprite-moves { font-size: 10px; color: #6b7280; text-align: center; max-width: 96px; line-height: 1.2; }
  </style>
</head>
<body>
  <h1>Best Team by Boss and Version</h1>
  <div class="muted">Walkthrough order from Silver + Monte Carlo team recommendations from Gold.</div>
  <div class="hint">Recommendations are based on damage simulation: only naturally learned level-up moves are considered; TM/HM moves are excluded.</div>

  <div class="controls">
    <div class="control">
      <label for="versionSelect">Version</label>
      <select id="versionSelect"></select>
    </div>
    <div class="control">
      <label for="bossSelect">Boss</label>
      <select id="bossSelect"></select>
    </div>
    <div class="control">
      <label for="starterSelect">Starter</label>
      <select id="starterSelect"></select>
    </div>
  </div>

  <div id="content"></div>

  <script>
    const spriteCache = new Map();
    let renderToken = 0;

    const DATA_PATH = "../data/gold/walkthrough_best_teams.json";
    const POKEMON_REFERENCE_PATH = "../data/silver/references/pokemon_reference.json";

    function fmtPct(value) {
      if (value === null || value === undefined) return "-";
      return (Number(value) * 100).toFixed(1) + "%";
    }

    function normName(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function safeText(value) {
      return value === null || value === undefined ? "-" : String(value);
    }

    function speciesSlug(value) {
      return String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function extractPokeIdFromUrl(url) {
      const match = String(url || "").match(/\/pokemon\/(\d+)\/?/);
      return match ? Number(match[1]) : null;
    }

    function spriteFromPokeId(pokeid) {
      const id = Number(pokeid);
      if (!Number.isFinite(id) || id <= 0) return null;
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
    }

    async function spriteFromReference(name, references) {
      const normalized = speciesSlug(name);
      const ref = references[normName(name)] || references[normalized];
      const refPokeId = ref && ref.url ? extractPokeIdFromUrl(ref.url) : null;
      const idSprite = spriteFromPokeId(refPokeId);
      if (idSprite) {
        return idSprite;
      }

      const pokemonUrl = (ref && ref.url) ? String(ref.url) : `https://pokeapi.co/api/v2/pokemon/${normalized}/`;
      if (spriteCache.has(pokemonUrl)) {
        return spriteCache.get(pokemonUrl);
      }

      try {
        const response = await fetch(pokemonUrl);
        if (!response.ok) {
          spriteCache.set(pokemonUrl, null);
          return null;
        }
        const payload = await response.json();
        const payloadIdSprite = payload && payload.id ? spriteFromPokeId(payload.id) : null;
        const spriteUrl = payloadIdSprite || (payload && payload.sprites ? payload.sprites.front_default : null);
        const resolved = spriteUrl ? String(spriteUrl) : null;
        spriteCache.set(pokemonUrl, resolved);
        return resolved;
      } catch (_) {
        spriteCache.set(pokemonUrl, null);
        return null;
      }
    }

    function placeholderSprite() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" rx="10" fill="#f8fafc"/><text x="36" y="40" font-size="10" text-anchor="middle" fill="#94a3b8">no sprite</text></svg>';
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function uniqueBosses(rows) {
      const seen = new Set();
      const result = [];
      rows.forEach((row) => {
        const key = row.boss_key || `${row.boss_order}:${normName(row.boss_name)}`;
        if (seen.has(key)) return;
        seen.add(key);
        result.push({ ...row, boss_key: key });
      });
      return result;
    }

    function starterChoices(version, payload) {
      const mapping = payload.starter_choices_by_version || {};
      return mapping[version] || [];
    }

    function starterFamilyMembers(version, starter, payload) {
      const allFamilies = payload.starter_family_members_by_version || {};
      const forVersion = allFamilies[version] || {};
      return forVersion[starter] || [starter];
    }

    function teamStatsHtml(team) {
      if (!team) return "<div class='team'>No team recommendation found.</div>";
      return `
        <div class='team'>
          <div>
            <span class='pill'>Win Rate ${fmtPct(team.mc_win_rate)}</span>
            <span class='pill'>${safeText(team.wins)}/${safeText(team.n_trials)} Wins</span>
            <span class='pill'>Avg Lv ${safeText(team.avg_level)}</span>
          </div>
          <div class="section">
            <div><b>Team ID:</b> ${safeText(team.team_id)}</div>
            <div style='margin-top:4px; color:#6b7280; font-size:13px;'>Movesets: level-up moves only, no TM/HM.</div>
          </div>
        </div>
      `;
    }

    function prettyLocation(slug) {
      return String(slug || "")
        .split("-")
        .filter(Boolean)
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function catchLocationsForPokemon(pokemon, row) {
      const map = row && row.reachable_location_pokemon ? row.reachable_location_pokemon : {};
      const name = pokemonName(pokemon);
      const speciesKey = speciesSlug((pokemon && pokemon.species_slug) || name);
      const results = [];
      Object.entries(map).forEach(([location, speciesList]) => {
        if (!Array.isArray(speciesList)) return;
        const hasSpecies = speciesList.some((entry) => speciesSlug(entry) === speciesKey);
        if (hasSpecies) results.push(location);
      });
      return results;
    }

    function encounterStatsForPokemon(pokemon, row) {
      const byLocation = row && row.reachable_location_encounters ? row.reachable_location_encounters : {};
      const speciesKey = speciesSlug((pokemon && pokemon.species_slug) || pokemonName(pokemon));
      let chanceMin = null;
      let chanceMax = null;
      let captureRate = null;

      Object.values(byLocation).forEach((encounters) => {
        if (!Array.isArray(encounters)) return;
        encounters.forEach((entry) => {
          if (!entry) return;
          const entrySpecies = speciesSlug(entry.species || "");
          if (entrySpecies !== speciesKey) return;

          const localMin = Number(entry.encounter_chance_min);
          const localMax = Number(entry.encounter_chance_max);
          if (Number.isFinite(localMin)) {
            chanceMin = chanceMin === null ? localMin : Math.min(chanceMin, localMin);
          }
          if (Number.isFinite(localMax)) {
            chanceMax = chanceMax === null ? localMax : Math.max(chanceMax, localMax);
          }

          const localCaptureRate = Number(entry.capture_rate);
          if (captureRate === null && Number.isFinite(localCaptureRate)) {
            captureRate = localCaptureRate;
          }
        });
      });

      return { chanceMin, chanceMax, captureRate };
    }

    function rarityLabel(chanceMax) {
      if (chanceMax === null || chanceMax === undefined || Number.isNaN(Number(chanceMax))) return "Unknown";
      const value = Number(chanceMax);
      if (value >= 35) return "Common";
      if (value >= 20) return "Uncommon";
      if (value >= 10) return "Rare";
      return "Very rare";
    }

    function pokemonName(pokemon) {
      return pokemon && pokemon.name ? String(pokemon.name) : "unknown";
    }

    async function spriteUrlForPokemon(pokemon, references) {
      const idSprite = spriteFromPokeId(pokemon && pokemon.pokeid ? pokemon.pokeid : null);
      if (idSprite) return idSprite;
      const payloadSprite = pokemon && pokemon.sprite_url ? String(pokemon.sprite_url) : null;
      if (payloadSprite) return payloadSprite;
      return await spriteFromReference(pokemonName(pokemon), references);
    }

    function buildCatchRecommendations(teams, row, version, starter, payload) {
      const byName = new Map();
      const starterFamily = new Set((starter && starterFamilyMembers(version, starter, payload) || []).map((v) => normName(v)));
      teams.forEach((team, idx) => {
        const rank = Number(team && team.rank_in_boss_version ? team.rank_in_boss_version : (idx + 1));
        const weight = Math.max(1, 6 - rank);
        const mons = Array.isArray(team && team.pokemon) ? team.pokemon : [];
        mons.forEach((pokemon) => {
          const name = pokemonName(pokemon);
          if (starterFamily.has(normName(name))) {
            return;
          }
          const variantKey = pokemon && pokemon.species_slug
            ? `slug:${pokemon.species_slug}`
            : (pokemon && pokemon.pokeid ? `id:${pokemon.pokeid}` : `name:${normName(name)}`);
          if (!byName.has(variantKey)) {
            byName.set(variantKey, {
              name,
              count: 0,
              score: 0,
              pokeid: pokemon && pokemon.pokeid ? Number(pokemon.pokeid) : null,
              species_slug: pokemon && pokemon.species_slug ? String(pokemon.species_slug) : speciesSlug(name),
              sprite_url: pokemon && pokemon.sprite_url ? String(pokemon.sprite_url) : null,
              catch_locations: catchLocationsForPokemon(pokemon, row),
              encounter_stats: encounterStatsForPokemon(pokemon, row),
            });
          }
          const item = byName.get(variantKey);
          item.count += 1;
          item.score += weight;
          if (!item.pokeid && pokemon && pokemon.pokeid) item.pokeid = Number(pokemon.pokeid);
          if (!item.species_slug && pokemon && pokemon.species_slug) item.species_slug = String(pokemon.species_slug);
          if (!item.sprite_url && pokemon && pokemon.sprite_url) item.sprite_url = String(pokemon.sprite_url);
          if ((!item.catch_locations || item.catch_locations.length === 0) && pokemon) {
            item.catch_locations = catchLocationsForPokemon(pokemon, row);
          }
          if ((!item.encounter_stats || item.encounter_stats.chanceMax === null) && pokemon) {
            item.encounter_stats = encounterStatsForPokemon(pokemon, row);
          }
        });
      });

      return Array.from(byName.values())
        .sort((a, b) => (b.score - a.score) || (b.count - a.count) || a.name.localeCompare(b.name))
        .slice(0, 10);
    }

    async function catchRecommendationHtml(rec, references) {
      const sprite = spriteFromPokeId(rec.pokeid) || rec.sprite_url || (await spriteFromReference(rec.name, references)) || placeholderSprite();
      const locations = Array.isArray(rec.catch_locations) ? rec.catch_locations : [];
      const stats = rec.encounter_stats || {};
      const rarity = rarityLabel(stats.chanceMax);
      const shown = locations.slice(0, 3).map(prettyLocation).join(", ");
      const locationLine = locations.length > 0
        ? `<div class="catch-score">Catch at: ${shown}${locations.length > 3 ? ` (+${locations.length - 3} more)` : ""}</div>`
        : `<div class="catch-score">Catch location unknown for this step.</div>`;
      const rarityLine = `<div class="catch-score">Encounter rarity: ${rarity}${stats.chanceMax !== null && stats.chanceMax !== undefined ? ` (max chance ${safeText(stats.chanceMax)}%)` : ""}</div>`;
      const catchRateLine = `<div class="catch-score">Catch rate: ${stats.captureRate !== null && stats.captureRate !== undefined ? safeText(stats.captureRate) : "Unknown"}</div>`;
      return `
        <div class="catch-card">
          <img class="sprite" src="${sprite}" alt="${rec.name} Sprite" onerror="this.onerror=null;this.src='${placeholderSprite()}'" />
          <div class="catch-meta">
            <div class="catch-name">${safeText(rec.name)}</div>
            <div class="catch-score">Priority ${safeText(rec.score)} · In ${safeText(rec.count)}/5 teams</div>
            ${locationLine}
            ${rarityLine}
            ${catchRateLine}
          </div>
        </div>
      `;
    }

    async function bossTeamHtml(bossTeam, references) {
      if (!bossTeam) return "<div class='team'>Boss team details unavailable.</div>";
      const strip = await teamSpriteStripHtml(bossTeam, references);
      return `
        <div class="rank-card">
          <div class='title' style='margin-bottom:10px;'>Boss team you are fighting</div>
          ${teamStatsHtml({
            ...bossTeam,
            mc_win_rate: null,
            wins: null,
            n_trials: null,
          })}
          <div class="section">
            <div class='title' style='margin-bottom:10px;'>Boss team Pokemon</div>
            ${strip}
          </div>
        </div>
      `;
    }

    async function teamSpriteStripHtml(team, references) {
      const mons = Array.isArray(team && team.pokemon) ? team.pokemon : [];
      if (mons.length === 0) return "<div class='team'>No Pokemon details available.</div>";
      const parts = await Promise.all(mons.map(async (pokemon) => {
        const sprite = (await spriteUrlForPokemon(pokemon, references)) || placeholderSprite();
        const requiredMoves = Array.isArray(pokemon && pokemon.required_moves)
          ? pokemon.required_moves
          : (Array.isArray(pokemon && pokemon.moves) ? pokemon.moves : []);
        const movesPreview = requiredMoves.slice(0, 2).join(", ");
        return `
          <div class="sprite-item">
            <img class="sprite-sm" src="${sprite}" alt="${pokemonName(pokemon)} Sprite" onerror="this.onerror=null;this.src='${placeholderSprite()}'" />
            <div class="sprite-label">${safeText(pokemonName(pokemon))}</div>
            <div class="sprite-moves">${movesPreview ? `Req: ${safeText(movesPreview)}` : "Req moves n/a"}</div>
          </div>
        `;
      }));
      return `<div class="sprite-strip">${parts.join("")}</div>`;
    }

    async function rankedTeamHtml(team, idx, references) {
      const spriteStrip = await teamSpriteStripHtml(team, references);
      const rank = safeText(team && team.rank_in_boss_version ? team.rank_in_boss_version : (idx + 1));
      return `
        <div class="rank-card">
          <div class='title' style='margin-bottom:10px;'>Rank #${rank}</div>
          ${teamStatsHtml(team)}
          <div class="section">
            <div class='title' style='margin-bottom:10px;'>Recommended Team (Sprite Overview)</div>
            ${spriteStrip}
          </div>
        </div>
      `;
    }

    function teamContainsStarterFamily(team, version, starter, payload) {
      if (!team || !starter) return true;
      const familyMembers = new Set(starterFamilyMembers(version, starter, payload).map((m) => normName(m)));
      const mons = Array.isArray(team.pokemon) ? team.pokemon : [];
      return mons.some((mon) => familyMembers.has(normName(mon && mon.name ? mon.name : "")));
    }

    function topTeamsForBoss(row, version, starter, payload) {
      const byStarter = row && row.top_teams_by_starter ? row.top_teams_by_starter : null;
      if (starter && byStarter && Array.isArray(byStarter[starter])) {
        return byStarter[starter].slice(0, 5);
      }
      const rawTop = Array.isArray(row.top_teams) ? row.top_teams : [];
      const filtered = rawTop.filter((team) => teamContainsStarterFamily(team, version, starter, payload));
      if (filtered.length > 0) return filtered.slice(0, 5);
      if (!starter && rawTop.length > 0) return rawTop.slice(0, 5);
      return (!starter && row.recommended_team) ? [row.recommended_team] : [];
    }

    async function pokemonCardHtml(pokemon, references) {
      const payloadSprite = pokemon && pokemon.sprite_url ? String(pokemon.sprite_url) : null;
      const sprite = payloadSprite || (await spriteFromReference(pokemon.name, references));
      const moves = Array.isArray(pokemon.moves) ? pokemon.moves : [];
      const movesText = moves.map((m) => (m && m.name ? m.name : m)).filter(Boolean).join(", ");
      const fallbackSprite = placeholderSprite();
      return `
        <div class="pokemon-card">
          <img class="sprite" src="${sprite || fallbackSprite}" alt="${pokemon.name} Sprite" onerror="this.onerror=null;this.src='${fallbackSprite}'" />
          <div class="pokemon-meta">
            <div class="pokemon-name">${pokemon.name}</div>
            <div class="pokemon-moves">Lv ${safeText(pokemon.level)}${movesText ? `<br/>${movesText}` : ''}</div>
          </div>
        </div>
      `;
    }

    async function starterBoxHtml(starter, references) {
      if (!starter) return "";
      const sprite = (await spriteFromReference(starter, references)) || placeholderSprite();
      return `
        <div class="starter-box">
          <img class="sprite" src="${sprite}" alt="${starter} Sprite" onerror="this.onerror=null;this.src='${placeholderSprite()}'" />
          <div>
            <div class="starter-badge">Starter locked for this walkthrough</div>
            <div class="pokemon-name">${starter}</div>
            <div class="pokemon-moves">Chosen once and reused consistently for this version.</div>
          </div>
        </div>
      `;
    }

    async function render(version, bossKey, starter, data, references) {
      const currentToken = ++renderToken;
      const container = document.getElementById("content");
      const rows = uniqueBosses((data.walkthroughs && data.walkthroughs[version]) || []);
      const selected = bossKey ? rows.find((row) => (row.boss_key || `${row.boss_order}:${normName(row.boss_name)}`) === bossKey) : rows[0];

      if (!selected) {
        container.innerHTML = "<div class='card'>No boss data found for the selected version.</div>";
        return;
      }

      const teams = topTeamsForBoss(selected, version, starter, data);
      const recommendations = buildCatchRecommendations(teams, selected, version, starter, data);
      const recommendationsHtml = recommendations.length > 0
        ? (await Promise.all(recommendations.map((rec) => catchRecommendationHtml(rec, references)))).join("")
        : "<div class='team'>No catch recommendations available.</div>";
      const rankedTeamsHtml = teams.length > 0
        ? (await Promise.all(teams.map((team, idx) => rankedTeamHtml(team, idx, references)))).join("")
        : "<div class='team'>No team rankings found.</div>";
      const starterBox = await starterBoxHtml(starter, references);
      const bossTeamSection = await bossTeamHtml(selected.boss_team, references);
      const reasonText = selected.recommended_team && selected.recommended_team.win_reason
        ? String(selected.recommended_team.win_reason)
        : "Selected by top simulation performance against the boss team.";

      if (currentToken !== renderToken) {
        return;
      }

      container.innerHTML = `
        <div class='card'>
          <div class='title'>#${safeText(selected.boss_order)} - ${safeText(selected.boss_name)}</div>
          <div class='meta'>Part ${safeText(selected.part)}${selected.location_count ? ` · Reachable Locations: ${selected.location_count}` : ""}</div>
          ${starterBox}
          <div class="section">
            <div class='title' style='margin-bottom:10px;'>Why this recommendation can win</div>
            <div class='team'>${safeText(reasonText)}</div>
          </div>
          <div class="section">
            ${bossTeamSection}
          </div>
          <div class="section">
            <div class='title' style='margin-bottom:10px;'>What should I catch? (sprite-first view)</div>
            <div class='catch-grid'>${recommendationsHtml}</div>
          </div>
          <div class="section">
            <div class='title' style='margin-bottom:10px;'>Top 5 teams per starter, boss, and game</div>
            ${rankedTeamsHtml}
          </div>
        </div>
      `;
    }

    async function boot() {
      const [response, refResponse] = await Promise.all([fetch(DATA_PATH), fetch(POKEMON_REFERENCE_PATH)]);
      if (!response.ok) {
        document.getElementById("content").innerHTML = "Error: walkthrough_best_teams.json not found. Please rebuild the Gold layer.";
        return;
      }
      const data = await response.json();
      const references = refResponse.ok ? await refResponse.json() : {};
      const select = document.getElementById("versionSelect");
      const bossSelect = document.getElementById("bossSelect");
      const starterSelect = document.getElementById("starterSelect");
      const versions = data.versions || [];
      select.innerHTML = versions.map(v => `<option value='${v}'>${v}</option>`).join("");

      function refreshStarters(version, preferredStarter = null) {
          const starters = starterChoices(version, data);
        starterSelect.innerHTML = starters.map((starter) => `<option value='${starter}'>${starter}</option>`).join("");
        if (preferredStarter && starters.includes(preferredStarter)) {
          starterSelect.value = preferredStarter;
        }
        if (!starterSelect.value && starters.length > 0) {
          starterSelect.value = starters[0];
        }
      }

      function refreshBosses(version, preferredBossKey = null) {
        const rows = uniqueBosses((data.walkthroughs && data.walkthroughs[version]) || []);
        bossSelect.innerHTML = rows.map((row) => {
          const key = row.boss_key || `${row.boss_order}:${normName(row.boss_name)}`;
          return `<option value='${key}'>#${safeText(row.boss_order)} - ${safeText(row.boss_name)}</option>`;
        }).join("");
        if (preferredBossKey && rows.some((row) => (row.boss_key || `${row.boss_order}:${normName(row.boss_name)}`) === preferredBossKey)) {
          bossSelect.value = preferredBossKey;
        }
        if (!bossSelect.value && rows.length > 0) {
          bossSelect.value = rows[0].boss_key || `${rows[0].boss_order}:${normName(rows[0].boss_name)}`;
        }
      }

      if (versions.length > 0) {
        refreshStarters(versions[0]);
        refreshBosses(versions[0]);
        void render(versions[0], bossSelect.value, starterSelect.value, data, references);
      }

      select.addEventListener("change", () => {
        refreshStarters(select.value);
        refreshBosses(select.value);
        void render(select.value, bossSelect.value, starterSelect.value, data, references);
      });

      bossSelect.addEventListener("change", () => void render(select.value, bossSelect.value, starterSelect.value, data, references));
      starterSelect.addEventListener("change", () => void render(select.value, bossSelect.value, starterSelect.value, data, references));
    }

    boot().catch((err) => {
      document.getElementById("content").innerText = "Load error: " + err;
    });
  </script>
</body>
</html>
